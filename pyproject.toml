
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "mlx-video"
dynamic = ["version"]
description = "MLX-Video is the best package for inference and finetuning of Image-Video-Audio generation models on your Mac using MLX."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.22.0",
    "numpy",
    "safetensors",
    "huggingface_hub",
    "transformers[tokenizers]",
    "tqdm",
    "opencv-python>=4.12.0.88",
    "Pillow>=10.3.0",
    "mlx-vlm",
    "rich>=14.2.0",
    "librosa>=0.10.0",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "ftfy",
]
license = {text="MIT"}
authors = [
    {name = "Prince Canuma", email = "prince.gdt@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/Blaizzy/mlx-video"
Repository = "https://github.com/Blaizzy/mlx-video"
Issues = "https://github.com/Blaizzy/mlx-video/issues"

[project.scripts]
"mlx_video.ltx_2.generate" = "mlx_video.models.ltx_2.generate:main"
"mlx_video.wan_2.generate" = "mlx_video.models.wan_2.generate:main"

[tool.setuptools.packages.find]
include = ["mlx_video*"]

[tool.setuptools.dynamic]
version = {attr = "mlx_video.version.__version__"}

[project.optional-dependencies]
dev = [
    "pytest",
]


[tool.ruff]
# The fork's own lint gate (sayvoy canvas plan, gate G). Upstream style is
# kept -- Optional[...] and typing.List stay, so upstream merges stay clean --
# which is why the rule set is pyflakes, pycodestyle, isort and bugbear only.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]

[tool.pytest.ini_options]
# Warnings fail the suite (sayvoy canvas plan, gate G). The one exception is
# third-party: sentencepiece 0.2.1's SWIG bindings trip a CPython
# DeprecationWarning at import that only a sentencepiece release can fix.
filterwarnings = [
    "error",
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]
